    expectation: {outcome: supported, provider_request: exact-except, client_response: exact-except, loss: none, dispatch_attempts: 1}
    provenance:
      origin: firebase-behavior-reexpression
      private_reference: thinking_filter.spec.ts native Anthropic thinking-preservation behavior
      sources: [anthropic_streaming]
    ownership: {primary: Data Plane & Networking, reviewers: [Evaluation & Quality, Agentic & Context], upstream_issues: [1138, 2358]}

  - id: import-16-signed-thinking-to-chat-reject
    tranche: firebase-derived-deferred
    contract: Required signed Anthropic thinking cannot be routed to Chat by stripping or relabeling it.
    client: {protocol: anthropic-messages, path: /v1/messages, mode: buffered}
    provider: {protocol: openai-chat, dialect: openrouter}
