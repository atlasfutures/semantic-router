      private_reference: providers.spec.ts encrypted-reasoning carrier and stream conversion behaviors
      sources: [openai_responses_streaming, anthropic_streaming]
    ownership: {primary: Data Plane & Networking, reviewers: [Evaluation & Quality, Agentic & Context], upstream_issues: [1138, 2358, 2999]}

  - id: import-14-anthropic-provider-switch-a-b-a
    tranche: firebase-derived-deferred
    contract: OpenAI Responses state can be hidden from an Anthropic turn without destroying the original carrier needed when routing returns to OpenAI.
    client: {protocol: anthropic-messages, path: /v1/messages, mode: sequence}
    provider: {protocol: mixed, dialect: openai-anthropic-openai}
    mutation_mode: translate
    features: [a-to-b-to-a, encrypted-reasoning, nonmutating-view, tools, continuation-lineage]
    synthetic_shape: Turn A yields an opaque reasoning carrier; turn B uses Messages; turn A replays the original opaque state.
    expectation:
      outcome: supported-with-declared-loss
      provider_request: semantic
      client_response: semantic
      invariants: [original-history-immutable, provider-a-carrier-restored, tool-pairing-preserved]
      fidelity: {/turn-b/provider-a-carrier: omitted, /turn-c/provider-a-carrier: mapped}
      loss: provider-a-state-not-visible-to-provider-b
      dispatch_attempts: 3
    provenance:
      origin: firebase-behavior-reexpression
      private_reference: providers.spec.ts nonmutating reasoning-carrier stripping and replay behaviors
      sources: [openai_responses, anthropic_messages, agentgateway_goldens]
    ownership: {primary: Data Plane & Networking, reviewers: [Agentic & Context, Evaluation & Quality, Enterprise & Environment], upstream_issues: [1138, 2358, 2999]}

  - id: import-15-anthropic-thinking-signature-stream
