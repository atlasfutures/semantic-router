apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: semantic-router
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: semantic-router
  namespace: default
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources: {}
  logging:
    level:
      default: debug
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: semantic-router
  namespace: default
spec:
  gatewayClassName: semantic-router
  listeners:
    - name: http
      protocol: HTTP
      port: 80
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: semantic-router
---
# Buffer limit for AI workloads (matches other profiles)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: semantic-router
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: semantic-router
  connection:
    bufferLimit: 50Mi
---
# A plain Gateway API route to the fixture, deliberately not an AIGatewayRoute.
#
# The Router owns protocol translation and emits the backend-native wire
# contract; Envoy owns transport and forwards those bytes unchanged. Keeping the
# AI Gateway translator out of the path is what makes the fixture's recording
# evidence about the Router rather than about two translators in series.
#
# It is also the only wiring that can carry native Anthropic egress. The AI
# Gateway external processor registers a fixed path set -- /v1/chat/completions,
# /v1/completions, /v1/embeddings, /v1/images/generations, /cohere/v2/rerank,
# /v1/models, /anthropic/v1/messages -- and answers "unsupported path" with 404
# for anything else. A model declaring api_format: anthropic dispatches to
# /v1/messages, which is not in that set, so an AIGatewayRoute drops the request
# before the provider ever sees it.
#
# One fixture serves every case, so no per-model rule is needed: the Router
# chooses the model semantically and the fixture records whatever arrives.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: semantic-router-direct
  namespace: default
spec:
  parentRefs:
    - name: semantic-router
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - backendRefs:
        - name: conformance-fixture
          kind: Backend
          group: gateway.envoyproxy.io
      timeouts:
        request: 120s
        backendRequest: 120s
---
# EnvoyPatchPolicy to add ExtProc filter for semantic-router
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: ai-gateway-prepost-extproc-patch-policy
  namespace: default
spec:
  jsonPatches:
    - name: default/semantic-router/http
      operation:
        op: add
        path: /default_filter_chain/filters/0/typed_config/http_filters/0
        value:
          name: semantic-router-extproc
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
            allow_mode_override: true
            grpcService:
              envoyGrpc:
                authority: semantic-router.vllm-semantic-router-system:50051
                clusterName: semantic-router
              timeout: 120s
            message_timeout: 120s
            processing_mode:
              request_body_mode: BUFFERED
              request_header_mode: SEND
              request_trailer_mode: SKIP
              response_body_mode: BUFFERED
              response_header_mode: SEND
              response_trailer_mode: SKIP
      type: type.googleapis.com/envoy.config.listener.v3.Listener
    - name: semantic-router
      operation:
        op: add
        path: ''
        value:
          connect_timeout: 120s
          http2_protocol_options: {}
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: semantic-router
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: semantic-router.vllm-semantic-router-system.svc.cluster.local
                          port_value: 50051
          name: semantic-router
          type: STRICT_DNS
      type: type.googleapis.com/envoy.config.cluster.v3.Cluster
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: semantic-router
  type: JSONPatch
