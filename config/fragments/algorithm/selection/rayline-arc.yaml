routing:
  decisions:
    - name: rayline-arc-route
      description: Experimental artifact-verified ARC selection with a fenced episode store.
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen3-8b
          use_reasoning: false
        - model: qwen3-32b
          use_reasoning: true
      adaptations:
        mode: bypass
      plugins:
        # ARC episode requests must never be persisted by Router Replay; the
        # validator rejects rayline_arc decisions whose effective replay
        # configuration is enabled.
        - type: router_replay
          configuration:
            enabled: false
      algorithm:
        type: rayline_arc
        on_error: fail_closed
        rayline_arc:
          artifact_dir: /var/lib/vllm-sr/rayline-arc
          artifact_revision: public-synthetic-v1
          # System text is folded into the user turn it governs, never into a
          # turn of its own: the encoder wire contract has only two roles.
          #
          # include_system_text covers the conversation-opening prompt: the
          # Anthropic system field, the Responses instructions field, and the
          # leading run of system/developer messages. Off by default, because
          # it changes what the trained selector is asked.
          include_system_text: false
          # drop_mid_conversation_system_text is the kill switch for the other
          # scope: a mid_conv_system block, or a system/developer message that
          # follows a user or assistant message. False by default, so that
          # text does reach the selector -- it is a correction aimed at the
          # very next reply, which is the signal the router exists to read.
          drop_mid_conversation_system_text: false
          # include_tool_names shows the selector which tools the turn had
          # available, as names only -- never the schemas. A 2026-09-17 probe
          # measured the full schema block moving 40.4% of first-turn
          # decisions, level with the bar that keeps include_system_text off;
          # names move 7.6% for 42 tokens. Off, because safe to send is not
          # the same as shown to help.
          include_tool_names: false
          # routes_api serves POST /v1/routes from this cell: the selector's
          # choice for a request, returned without executing it. Off, and not
          # implied by configuring this algorithm -- a lookup drives the
          # encoder with no paying turn behind it, on the same instance that
          # serves routed traffic.
          routes_api:
            enabled: false
            # Bounds one lookup end to end. The encoder's own timeout is
            # sized for a dispatched turn that streams, so without this a
            # wedged encoder holds a caller waiting on a single answer.
            deadline_ms: 0
            # Lets a lookup join a conversation's trajectory, with the lease
            # and store round trip that implies. Off, so a lookup costs the
            # encode and nothing else. Turn it on for a gateway calling this
            # every turn: a stable episode identity is also the encoder's
            # prefix cache key.
            episode_writes: false
            # Human-readable release name published beside the artifact hash,
            # as "<label>.<hash>". Separate from artifact_revision, which is
            # deployment-private.
            checkpoint_label: ""
          encoder:
            base_url: http://rayline-arc-encoder:8000
            # Set base_url to empty and populate replicas + failover to opt
            # into the versioned retained-session multi-replica contract.
            replicas: []
            # Or leave replicas empty and populate membership to use the
            # reviewed Redis dynamic-membership controller.
            membership: {}
            failover: {}
            model: Qwen/Qwen3.5-0.8B
            model_revision: 2fc06364715b967f1860aea9cf38778875588b17
            expected_build_id: vllm@public-synthetic-build
            expected_io_plugin_version: rayline-arc-io@0.1.0
            serializer_version: mtrouter-token-blocks-v2
            serving_rung: B
            required_pooling_capabilities:
              - chunked_causal_mean
            modal_key_env: RAYLINE_ARC_MODAL_KEY
            modal_secret_env: RAYLINE_ARC_MODAL_SECRET
            connect_timeout_seconds: 5
            total_timeout_seconds: 180
            max_retries: 1
            # Cap concurrent encoder calls per router process and shed the
            # surplus immediately instead of queueing it inside the encoder.
            # 0 disables admission control, which is the default. Size it from
            # a measured concurrency level the encoder sustains inside the
            # decision latency budget, and never above the encoder's own
            # ingress cap.
            max_inflight_encoder_calls: 0
            # Readiness re-probe schedule. The startup encoder probe is not
            # one-shot: a failed probe is retried on an exponential backoff
            # between these two delays until the encoder answers, so a
            # transient rejection at boot does not pin the instance at
            # ready=0 for its lifetime. 0 selects the shipped 5 s / 60 s.
            probe_retry_initial_seconds: 5
            probe_retry_max_seconds: 60
          episode:
            id_header: x-rayline-episode-id
            close_header: ""
            backend: redis
            key_prefix: "vsr:rayline-arc:"
            acquire_timeout_seconds: 30
            lease_ttl_seconds: 60
            idle_ttl_seconds: 900
            max_in_memory_episodes: 1024
            development_mode: false
            redis:
              address: redis:6379
              db: 0
              password_env: RAYLINE_ARC_REDIS_PASSWORD
              use_tls: false
              pool_size: 16
