name: rayline-arc-e2e

services:
  artifact-init:
    build:
      context: ../../../e2e/testing/rayline-arc
    user: "0:0"
    command:
      - sh
      - -ceu
      - |
        python /app/artifact_fixture.py /artifact
        chmod -R a=rX /artifact
    volumes:
      - arc-artifact:/artifact
    restart: "no"

  fake-encoder:
    build:
      context: ../../../e2e/testing/rayline-arc
    command: ["python", "/app/mock_servers.py", "encoder", "--port", "8080"]
    ports:
      - "${RAYLINE_ARC_E2E_ENCODER_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 1s
      timeout: 3s
      retries: 30

  fake-provider:
    build:
      context: ../../../e2e/testing/rayline-arc
    command: ["python", "/app/mock_servers.py", "provider", "--port", "8081"]
    ports:
      - "${RAYLINE_ARC_E2E_PROVIDER_PORT:-18081}:8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -ceu
      - 'exec redis-server --save "" --appendonly no --requirepass "$$RAYLINE_ARC_REDIS_PASSWORD"'
    environment:
      RAYLINE_ARC_REDIS_PASSWORD: ${RAYLINE_ARC_E2E_REDIS_PASSWORD:-public-e2e-redis-secret}
      REDISCLI_AUTH: ${RAYLINE_ARC_E2E_REDIS_PASSWORD:-public-e2e-redis-secret}
    ports:
      - "${RAYLINE_ARC_E2E_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  router:
    image: ${RAYLINE_ARC_ROUTER_IMAGE:-ghcr.io/vllm-project/semantic-router/vllm-sr:latest}
    pull_policy: never
    environment:
      SYNTHETIC_API_KEY: public-e2e-provider-key
      RAYLINE_ARC_MODAL_KEY: ${RAYLINE_ARC_E2E_MODAL_KEY:-public-e2e-modal-key}
      RAYLINE_ARC_MODAL_SECRET: ${RAYLINE_ARC_E2E_MODAL_SECRET:-public-e2e-modal-secret}
      RAYLINE_ARC_REDIS_PASSWORD: ${RAYLINE_ARC_E2E_REDIS_PASSWORD:-public-e2e-redis-secret}
    command: ["/app/config/rayline-arc.yaml"]
    volumes:
      - ${RAYLINE_ARC_E2E_CONFIG_PATH:-./config.yaml}:/app/config/rayline-arc.yaml:ro
      - arc-artifact:/var/lib/vllm-sr/rayline-arc:ro
    ports:
      - "${RAYLINE_ARC_E2E_ROUTER_API_PORT:-18082}:8080"
      - "${RAYLINE_ARC_E2E_METRICS_PORT:-19190}:9190"
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      fake-encoder:
        condition: service_healthy
      redis:
        condition: service_healthy

  envoy:
    image: envoyproxy/envoy:v1.34-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warning"]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "${RAYLINE_ARC_E2E_ENVOY_PORT:-18888}:8888"
    depends_on:
      - router
      - fake-provider

volumes:
  arc-artifact:
