version: v0.3

listeners:
  - name: rayline-arc-e2e
    address: 0.0.0.0
    port: 8888
    timeout: 30s

providers:
  defaults:
    default_model: worker-a
  models:
    - name: worker-a
      provider_model_id: synthetic/provider-a
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 1
        cached_input_per_1m: 0.5
        cache_write_per_1m: 1.5
        completion_per_1m: 2
      backend_refs:
        - name: openrouter
          endpoint: ${RAYLINE_ARC_WORKER_A_ENDPOINT}
          protocol: ${RAYLINE_ARC_WORKER_A_PROTOCOL}
          type: openai
          base_url: ${RAYLINE_ARC_WORKER_A_BASE_URL}
          provider: openai
          api_key_env: SYNTHETIC_API_KEY
    - name: worker-b
      provider_model_id: synthetic/provider-b
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 2
        cached_input_per_1m: 1
        cache_write_per_1m: 2.5
        completion_per_1m: 4
      backend_refs:
        - name: openrouter
          endpoint: ${RAYLINE_ARC_WORKER_B_ENDPOINT}
          protocol: ${RAYLINE_ARC_WORKER_B_PROTOCOL}
          type: openai
          base_url: ${RAYLINE_ARC_WORKER_B_BASE_URL}
          provider: openai
          api_key_env: SYNTHETIC_API_KEY

routing:
  modelCards:
    - name: worker-a
      modality: text
    - name: worker-b
      modality: text
  decisions:
    - name: rayline-arc-e2e
      description: Public synthetic full-stack ARC acceptance route
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: worker-a
          use_reasoning: false
        - model: worker-b
          use_reasoning: true
      adaptations:
        mode: bypass
      plugins:
        # Router Replay defaults to enabled in canonical configs; ARC episode
        # requests must never be persisted, and validation enforces this.
        - type: router_replay
          configuration:
            enabled: false
      algorithm:
        type: rayline_arc
        on_error: fail_closed
        rayline_arc:
          artifact_dir: /var/lib/vllm-sr/rayline-arc
          artifact_revision: public-rayline-arc-e2e-v2
          encoder:
            membership:
              schema_version: rayline.arc.encoder-membership.v1
              source: redis
              refresh_seconds: 1
            failover:
              schema_version: rayline.arc.encoder-failover.v1
              unavailable_status_codes: [404, 410, 502, 503, 504]
              unavailable_cooldown_seconds: 1
              max_remaps: 1
            model: Qwen/Qwen3.5-0.8B
            model_revision: 2fc06364715b967f1860aea9cf38778875588b17
            expected_build_id: ${RAYLINE_ARC_ENCODER_BUILD_ID}
            expected_io_plugin_version: rayline-arc-io@0.1.0
            serializer_version: mtrouter-token-blocks-v2
            serving_rung: B
            required_pooling_capabilities:
              - chunked_causal_mean
              - resumable_causal_mean
            modal_key_env: RAYLINE_ARC_MODAL_KEY
            modal_secret_env: RAYLINE_ARC_MODAL_SECRET
            connect_timeout_seconds: 5
            total_timeout_seconds: 10
            max_retries: 0
          episode:
            id_header: x-rayline-episode-id
            close_header: x-rayline-episode-close
            backend: redis
            key_prefix: "vsr:rayline-arc:"
            acquire_timeout_seconds: 5
            lease_ttl_seconds: 3
            # Short only in the hermetic stack so controller-driven drain
            # completion is observable without a five-minute test delay.
            idle_ttl_seconds: 12
            max_in_memory_episodes: 128
            redis:
              address: redis:6379
              db: 0
              password_env: RAYLINE_ARC_REDIS_PASSWORD
              use_tls: false
              pool_size: 16

global:
  stores:
    semantic_cache:
      enabled: false
  model_catalog:
    embeddings:
      semantic:
        mmbert_model_path: ""
        qwen3_model_path: ""
        gemma_model_path: ""
        bert_model_path: ""
        multimodal_model_path: ""
    modules:
      prompt_guard:
        enabled: false
        model_ref: ""
        model_id: ""
        jailbreak_mapping_path: ""
        use_mmbert_32k: false
      classifier:
        domain:
          model_ref: ""
          model_id: ""
          category_mapping_path: ""
          use_mmbert_32k: false
        pii:
          model_ref: ""
          model_id: ""
          pii_mapping_path: ""
          use_mmbert_32k: false
      feedback_detector:
        enabled: false
        model_ref: ""
        model_id: ""
        use_mmbert_32k: false
