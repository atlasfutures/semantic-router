admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: rayline-arc-openrouter-http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8888
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rayline_arc_openrouter_ingress
                codec_type: AUTO
                stream_idle_timeout: 180s
                route_config:
                  name: rayline_arc_openrouter_route
                  virtual_hosts:
                    - name: rayline_arc_openrouter
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /v1/
                            headers:
                              - name: x-selected-model
                                string_match:
                                  exact: worker-a
                          route: &openrouter_route
                            cluster: openrouter
                            timeout: 180s
                            idle_timeout: 180s
                            prefix_rewrite: /api/v1/
                            host_rewrite_literal: openrouter.ai
                        - match:
                            prefix: /v1/
                            headers:
                              - name: x-selected-model
                                string_match:
                                  exact: worker-b
                          route: *openrouter_route
                        - match:
                            prefix: /v1/
                            headers:
                              - name: x-selected-model
                                string_match:
                                  exact: worker-c
                          route: *openrouter_route
                        - match:
                            prefix: /
                          direct_response:
                            status: 503
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      allow_mode_override: true
                      grpc_service:
                        envoy_grpc:
                          cluster_name: semantic_router
                        timeout: 180s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                      message_timeout: 180s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: semantic_router
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: semantic_router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: router
                      port_value: 50051
    - name: openrouter
      connect_timeout: 10s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: openrouter
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: openrouter.ai
                      port_value: 443
                  hostname: openrouter.ai
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: openrouter.ai
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
              tls_maximum_protocol_version: TLSv1_3

layered_runtime:
  layers:
    - name: static_layer
      static_layer:
        overload:
          global_downstream_max_connections: 1000
