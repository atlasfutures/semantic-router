admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: rayline-remote-http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8888
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rayline_remote_ingress
                codec_type: AUTO
                stream_idle_timeout: 10s
                route_config:
                  name: rayline_remote_route
                  virtual_hosts:
                    - name: rayline_remote
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                            headers:
                              - name: x-selected-model
                                string_match:
                                  exact: worker-a
                          route:
                            cluster: fake_provider_a
                            timeout: 2s
                        - match:
                            prefix: /
                            headers:
                              - name: x-selected-model
                                string_match:
                                  exact: worker-b
                          route:
                            cluster: fake_provider_b
                            timeout: 2s
                        - match:
                            prefix: /
                          direct_response:
                            status: 503
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      allow_mode_override: true
                      grpc_service:
                        envoy_grpc:
                          cluster_name: semantic_router
                        timeout: 30s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                      message_timeout: 15s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: semantic_router
      connect_timeout: 5s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: semantic_router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: router
                      port_value: 50051
    - name: fake_provider_a
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: fake_provider_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: fake-provider-a
                      port_value: 8081
    - name: fake_provider_b
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: fake_provider_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: fake-provider-b
                      port_value: 8082

layered_runtime:
  layers:
    - name: static_layer
      static_layer:
        overload:
          global_downstream_max_connections: 1000
