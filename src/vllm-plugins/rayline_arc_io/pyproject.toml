[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayline-arc-io"
version = "0.1.0"
description = "vLLM IO Processor for the frozen Rayline ARC serializer and pooling contract"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
]

[project.entry-points."vllm.io_processor_plugins"]
rayline_arc_io = "rayline_arc_io:register_io_processor"

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "torch>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.isort]
known-third-party = ["rayline_arc_io"]

[tool.uv]
# filelock GHSA-v4x8-3wr5-3wq8 affects >=3.20.4,<=4.2.0. The fix (4.2.1) needs
# Python 3.11+, so Python 3.10 stays on 3.20.3, below the affected range. Both are exact
# so the lock takes the first patched release, not the newest.
constraint-dependencies = [
    "filelock==4.2.1; python_version >= '3.11'",
    "filelock==3.20.3; python_version < '3.11'",
]
